name: Package Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version for the packages, for example 0.1.1 (defaults to a git-derived dev version)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - "pkg-linux/**"

permissions:
  contents: read

concurrency:
  group: package-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Linux x64 DEB and RPM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve package version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            # jpackage/Compose nativeDistributions require MAJOR.MINOR.BUILD (numeric,
            # MAJOR/MINOR <= 255, BUILD <= 65535). With no explicit version, derive a
            # legal dev version: use the numeric prefix of the latest tag, else 0.0.1,
            # and fold a monotonic counter into the BUILD component for uniqueness.
            describe="$(git describe --tags --always 2>/dev/null || true)"
            tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            base="0.0.1"
            if [[ -n "${tag}" ]] && [[ "${tag#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            fi
            # commits-since-tag (or total commits if no tag) -> BUILD bump keeps it unique & legal.
            since="$(git rev-list --count HEAD 2>/dev/null || echo 0)"
            build=$(( ${base##*.} + since % 60000 ))
            major="${base%%.*}"; rest="${base#*.}"; minor="${rest%%.*}"
            version="${major}.${minor}.${build}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved package version: ${version}"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Build profiler assets
        shell: bash
        run: |
          npm install --global yarn@1
          ./scripts/firefox-profiler.sh all
          ./scripts/build-perfetto-ui.sh download
          PERFETTO_TOOLS_DIR="$PWD/build/perfetto-tools" ./scripts/install-trace-processor.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            desktop-viewer/*.gradle.kts
            desktop-viewer/gradle/libs.versions.toml
            desktop-viewer/gradle/wrapper/gradle-wrapper.properties
            desktop-viewer/**/build.gradle.kts

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build DEB and RPM
        run: ./desktop-viewer/gradlew -p desktop-viewer :desktop-app:packageDeb :desktop-app:packageRpm -PappVersion=${{ steps.ver.outputs.version }} -Ptarget.arch=x64 --no-daemon

      - name: Prepare Linux assets
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: x64
        run: |
          set -euo pipefail
          deb_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/deb/*.deb)
          if [[ "${#deb_packages[@]}" -ne 1 || ! -f "${deb_packages[0]}" ]]; then
            echo "::error::Expected exactly one DEB package."
            exit 1
          fi
          rpm_packages=(desktop-viewer/desktop-app/build/compose/binaries/main/rpm/*.rpm)
          if [[ "${#rpm_packages[@]}" -ne 1 || ! -f "${rpm_packages[0]}" ]]; then
            echo "::error::Expected exactly one RPM package."
            exit 1
          fi
          mkdir -p release-assets
          cp "${deb_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-$ARCH.deb"
          cp "${rpm_packages[0]}" "release-assets/AndroidPerfermanceStudio-$VERSION-linux-$ARCH.rpm"

      - name: Upload Linux installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
